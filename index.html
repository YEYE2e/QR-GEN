<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Crea códigos QR para tus enlaces gratis, directamente en tu navegador.">
  <title>QR GEN</title>
  <link rel="stylesheet" href="styles.css">
  <script src="qrcode.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="generator">
    <div class="heading">
      <span class="mark" aria-hidden="true">▦</span>
      <h1>Generador QR</h1>
    </div>

    <form id="qr-form" novalidate>
      <label for="url">Enlace</label>
      <input id="url" name="url" type="text" inputmode="url" autocomplete="url" placeholder="https://ejemplo.com" aria-describedby="url-error" required>
      <p id="url-error" class="error" role="alert"></p>
      <button class="generate" type="submit">Generar QR <span aria-hidden="true">↗</span></button>
    </form>

    <div class="preview">
      <div class="qr-frame">
        <div id="empty-state" class="empty-state"><span aria-hidden="true">▦</span>Tu QR aparecerá aquí</div>
        <canvas id="qr-canvas" hidden aria-label="Código QR generado"></canvas>
      </div>
      <p id="qr-status" class="status" role="status"></p>
      <button id="download" class="download" type="button" disabled>Descargar PNG <span aria-hidden="true">↓</span></button>
    </div>
  </main>
</body>
</html>
